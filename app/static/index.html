<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warehouse Outbound Invoice Agent</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; font-family: monospace; }
    button { margin: 0.5rem 0.5rem 0.5rem 0; padding: 0.4rem 1rem; }
    table { border-collapse: collapse; }
    td { border: 1px solid #ccc; padding: 0.25rem 0.75rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <main>
    <h1>Warehouse Outbound Invoice Agent</h1>
    <p>Paste an outbound invoice or goods issue document. Use synthetic data only.</p>

    <label for="message">Document text</label>
    <textarea id="message" rows="10">Invoice No: INV-1001
Order No: ORD-2001
Warehouse: WH-IST-01
Customer: CUST-1001
Product: PROD-001
Quantity: 10
Destination: Ankara
Document text: Please prepare this shipment.</textarea>
    <button id="send">Send</button>
    <p id="error" class="error"></p>

    <section id="result" hidden>
      <h2>Result</h2>
      <p>Status: <strong id="status"></strong></p>
      <p id="answer"></p>

      <h3>Extracted fields</h3>
      <table id="fields"></table>

      <h3>Validation issues</h3>
      <ul id="issues"></ul>

      <h3>Tool calls</h3>
      <ol id="tools"></ol>

      <h3>Approval</h3>
      <p>Status: <strong id="approval"></strong></p>
      <p id="summary"></p>
      <button id="approve" hidden>Approve</button>
      <button id="reject" hidden>Reject</button>
      <button id="release" hidden>Release shipment</button>
      <p id="release-result"></p>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
